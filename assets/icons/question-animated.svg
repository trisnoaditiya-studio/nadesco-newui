<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Pertanyaan Umum">
<title>Pertanyaan Umum</title>
<style>
svg{overflow:visible}
.ic{animation:fadein .7s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ring{transform-origin:8px 8px;animation:pulse 2.8s cubic-bezier(.45,0,.25,1) infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.mark{transform-origin:8px 9px;animation:tilt 2.8s cubic-bezier(.45,0,.25,1) infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(0)}75%{transform:rotate(8deg)}}
.dot{transform-origin:7.98px 10.95px;animation:pop 2.8s ease-in-out infinite}
@keyframes pop{0%,40%,100%{transform:scale(1)}50%{transform:scale(1.45)}60%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
