</style>
<circle cx="12" cy="12" r="10"></circle><path class="a mer" d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path class="lat" d="M2 12h20"></path>
</svg>
