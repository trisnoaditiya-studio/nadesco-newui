<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Inovasi">
<title>Inovasi</title>
<style>
.s{transform-box:fill-box;transform-origin:50% 55%;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(.86) rotate(-12deg)}70%{transform:scale(1.04) rotate(4deg)}}
.k{transform-box:fill-box;transform-origin:center;animation:sp 1.8s ease-in-out infinite}
