<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Instagram">
<title>Instagram</title>
<style>
.a{transform-box:view-box}
.body{animation:body 2s ease-in-out infinite}
@keyframes body{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.lens{transform-origin:12px 12px;animation:lens 2s ease-in-out infinite}
@keyframes lens{0%,100%{transform:scale(1)}45%,55%{transform:scale(.78)}}
.flash{animation:flash 2s steps(1) infinite}
@keyframes flash{0%,40%,70%,100%{opacity:1}45%,65%{opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g class="a body"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle class="a lens" cx="12" cy="12" r="4"></circle><line class="flash" x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></g>
</svg>
