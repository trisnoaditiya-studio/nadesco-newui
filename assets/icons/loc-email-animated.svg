<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Email">
<title>Email</title>
<style>
.a{transform-box:view-box}
.flap{transform-origin:12px 7px;animation:flap 2s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}40%,60%{transform:scaleY(-.55)}}
.env{animation:env 2s ease-in-out infinite}
@keyframes env{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.sent{stroke-dasharray:4 14;animation:sent 2s linear infinite}
@keyframes sent{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<g class="a env"><rect x="3" y="5" width="18" height="14" rx="2"></rect><polyline class="a flap" points="3,7 12,13 21,7"></polyline></g>
</svg>
