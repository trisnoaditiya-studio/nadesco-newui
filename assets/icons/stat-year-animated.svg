<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Tahun">
<title>Tahun</title>
<style>
.a{transform-box:fill-box}
.ck{stroke-dasharray:10;stroke-dashoffset:10;animation:ck 1.8s ease-in-out infinite}
